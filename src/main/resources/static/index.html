<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#422438" />
    <meta
      name="description"
      content="Find your next great experience. Discover events, choose your seats, and keep your tickets together with EventHQ."
    />
    <title>EventHQ — Make a little room for extraordinary.</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/app.css" />
    <script src="/assets/app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <aside class="sidebar" id="sidebar">
      <button
        id="close-menu"
        class="icon-button mobile-nav-close"
        aria-label="Close navigation"
      >
        ×
      </button>
      <a class="brand" href="#discover" aria-label="EventHQ home"
        ><span class="brand-mark">e<span>✳</span></span
        >event<span class="brand-light">hq</span
        ><span class="brand-dot">.</span></a
      >
      <div class="workspace-label">A LITTLE MORE LIVING</div>
      <nav aria-label="Main navigation">
        <a href="#discover" data-nav="discover"
          ><span class="nav-icon">◈</span>Discover events<span class="nav-arrow"
            >↗</span
          ></a
        ><a href="#tickets" data-nav="tickets"
          ><span class="nav-icon">◈</span>My tickets</a
        ><a href="#admin" data-nav="admin" id="admin-nav" hidden
          ><span class="nav-icon">◈</span>Manage events</a
        >
      </nav>
      <div class="sidebar-note">
        <span class="note-star">✳</span>
        <p>Less scrolling.<br />More <em>being there.</em></p>
        <span>Good things happen offline.</span>
      </div>
      <div class="sidebar-bottom">
        <span class="status-dot" id="status-dot"></span
        ><span id="service-status">Connecting…</span
        ><span class="version">01</span>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <button
          class="icon-button mobile-menu"
          id="menu-button"
          aria-label="Toggle navigation"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          ☰
        </button>
        <div class="breadcrumb">
          Your world <span>/</span> <strong id="breadcrumb">Discover</strong>
        </div>
        <div class="top-actions">
          <span class="today" id="today"></span
          ><button class="account-button" id="account-button">
            Sign in <span>↗</span></button
          ><button class="text-button" id="logout-button" hidden>
            Sign out
          </button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer class="footer">
        <a href="#discover">eventhq.</a
        ><span>A ticket to something worth remembering.</span
        ><span
          >Built around the experience. <span class="footer-star">✳</span></span
        >
      </footer>
    </div>
    <dialog id="modal" aria-labelledby="modal-title">
      <div id="modal-content"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <noscript
      ><p class="noscript">
        Please enable JavaScript to browse events and book tickets.
      </p></noscript
    >
  </body>
</html>
