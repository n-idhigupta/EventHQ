spring.application.name=EventHQ
spring.profiles.default=dev
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=false
server.error.include-message=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
logging.structured.format.console=logstash
eventhq.jwt-secret=${JWT_SECRET}
eventhq.jwt-lifetime=15m
eventhq.hold-duration=10m
eventhq.currency=INR
eventhq.vip-multiplier=1.50
eventhq.early-bird-multiplier=0.80
eventhq.cache-size=256
eventhq.cache-ttl=5m
eventhq.http-timeout=5s
eventhq.currency-url=${CURRENCY_URL:}
eventhq.weather-url=${WEATHER_URL:}
eventhq.admin-email=${ADMIN_EMAIL:}
eventhq.admin-password=${ADMIN_PASSWORD:}
